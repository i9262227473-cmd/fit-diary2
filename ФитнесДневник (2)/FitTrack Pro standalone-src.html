<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<meta name="ext-resource-dependency" content="img/workout-chest.png" data-resource-id="workoutChest" />
<meta name="ext-resource-dependency" content="img/exercise-bench.png" data-resource-id="exerciseBench" />
<meta name="ext-resource-dependency" content="img/workout-legs.png" data-resource-id="workoutLegs" />
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1C1C1E;
  --surface:#2A2A2D;
  --surface2:#1F1F22;
  --border:#3A3A3D;
  --accent:#3DDC5C;
  --accent-bright:#4FE870;
  --accent-dim:rgba(61,220,92,0.15);
  --text:#FFFFFF;
  --text-muted:#8E8E93;
  --text-dim:#636366;
  --red:#FF453A;
  --orange:#FF9F0A;
  --blue:#5AC8FA;
  --yellow:#FFD60A;
  --pink:#FF375F;
  --font:'Inter',-apple-system,sans-serif;
}
html,body{height:100%;background:#000}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text)}
#root{display:flex;align-items:center;justify-content:center;width:100%;height:100vh}
button{font-family:var(--font);outline:none}
input,textarea,select{font-family:var(--font);outline:none}
::-webkit-scrollbar{width:0;display:none}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="fittrack-app-standalone.jsx"></script>
<script type="text/babel" src="fittrack-screens.jsx"></script>
<template id="__bundler_thumbnail" data-bg-color="#1C1C1E">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#1C1C1E"/>
    <rect x="40" y="6" width="40" height="68" rx="9" fill="#2A2A2D"/>
    <circle cx="60" cy="32" r="13" fill="none" stroke="#3A3A3D" stroke-width="3"/>
    <circle cx="60" cy="32" r="13" fill="none" stroke="#3DDC5C" stroke-width="3" stroke-dasharray="60 22" stroke-linecap="round" transform="rotate(-90 60 32)"/>
    <text x="60" y="35" text-anchor="middle" fill="#FFF" font-size="9" font-weight="700">75%</text>
    <rect x="46" y="50" width="28" height="3" rx="1.5" fill="#3DDC5C"/>
    <rect x="46" y="56" width="20" height="3" rx="1.5" fill="#5AC8FA"/>
    <rect x="46" y="62" width="24" height="3" rx="1.5" fill="#FFD60A"/>
  </svg>
</template>
</body>
</html>
