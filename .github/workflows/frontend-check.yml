name: Frontend build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/split-dashboard-components

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Save test build
        uses: actions/upload-artifact@v4
        with:
          name: fit-diary-test-build
          path: dist
          retention-days: 14
