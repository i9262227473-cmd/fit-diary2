name: Apply safe refactor

on:
  push:
    branches:
      - agent/split-dashboard-components
    paths:
      - scripts/refactor_voice_button.py
      - .github/workflows/apply-safe-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-dashboard-components

      - name: Apply exact VoiceButton refactor
        run: python3 scripts/refactor_voice_button.py

      - name: Commit only when file changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DashboardPage.jsx
          git commit -m "refactor: connect extracted VoiceButton"
          git push
